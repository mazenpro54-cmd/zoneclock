<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="description" content="ZoneClock — Workplace time tracking: check in and out when you're in the zone." />
    <link rel="icon" type="image/svg+xml" href="/clock.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>ZoneClock</title>
  </head>
  <body style="background: #0f0f13; margin: 0; padding: 0;">
    <div id="root">
      <div id="app-loading" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f0f13; color: #818cf8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="width: 44px; height: 44px; border: 3px solid rgba(99, 102, 241, 0.2); border-top-color: #6366f1; border-radius: 50%; animation: app-spin 0.8s linear infinite;"></div>
        <p style="margin-top: 14px; font-size: 14px; font-weight: 500; color: #8b8ba8;">Starting ZoneClock…</p>
        <style>@keyframes app-spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var el = document.getElementById('app-loading');
        if (el && !window.__react_mounted) {
          el.innerHTML = '<div style="padding: 24px; text-align: center; color: #ef4444;"><h3 style="margin-bottom: 8px;">Failed to start ZoneClock</h3><p style="color: #8b8ba8; font-size: 13px; max-width: 320px; word-break: break-all;">' + (e.message || 'Script error') + '</p><button onclick="window.location.reload()" style="margin-top: 14px; background: #6366f1; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;">Retry</button></div>';
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
